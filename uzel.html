<!DOCTYPE html>
<html lang="ru">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог ПРОМБУРГ: опоры, детали трубопроводов, компенсаторы — узел трассы</title>
<meta name="description" content="Подбор от задачи: схема трассы, назначение изделия, диаметр и нагрузка. Опоры, детали трубопроводов, компенсаторы ООО «ПРОМБУРГ».">
<link rel="icon" href="assets/brand/logo-mark.svg">
<link rel="stylesheet" href="kat.css?v=2610120115">
<style>
/* Вид «Узел трассы»: вход от задачи. Тёмный фон, линейная графика, жёлтый акцент. */
:root{--font:'Segoe UI',Inter,Arial,sans-serif;--mono:Consolas,'Cascadia Mono',monospace;
  --bg:#0D1922;--panel:#15252F;--ink:#EAF0F4;--mute:#8FA3B1;--line:#22384A;--line-2:#3B566A;
  --acc:#FFC53D;--acc-ink:#1A1300;--link:#FFC53D;--sel:#1D3442;--load:#1A2F3C;--th:#08121A;--th-ink:#EAF0F4;
  --stage:radial-gradient(ellipse at 50% 40%,#FFFFFF 0%,#E9EEF2 70%,#CFD8DF 100%);
  --logo-bg:#EAF0F4;--logo-fg:#0D1922;--radius:8px;--cover:#0D1922;--cover-ink:#EAF0F4;--wm-filter:invert(1);--wm-page:.03;
  --tr-line:#8FA3B1;--tr-pipe:#3B566A;--tr-acc:#FFC53D;--tr-mute:#8FA3B1}
.wm{--wm-filter:none}
.top{position:sticky;top:0;z-index:20;background:rgba(13,25,34,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;height:62px}
.top nav{display:flex;gap:2px}
.top nav a{padding:7px 12px;border-radius:6px;text-decoration:none;font-weight:600;font-size:14px;color:var(--mute)}
.top nav a:hover,.top nav a.on{color:var(--acc);background:var(--panel)}
.top .search{margin-left:auto}
.hero{padding:40px 0 8px}
.hero h1{font-size:44px;max-width:900px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--acc)}
.scheme{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(#101F2A,#0B161E);padding:10px 14px}
.trassa{display:block;width:100%;height:auto}
.trassa text{font-family:var(--font);fill:var(--tr-mute);font-size:13px}
.trassa .tr-acc{fill:var(--tr-acc);font-size:12px}
.hs{cursor:pointer;outline:none}
.hs-body{fill:#22384A;stroke:#EAF0F4;stroke-width:1.6}
.hs-x{stroke:#EAF0F4;stroke-width:1.6}
.hs-rod{stroke:#EAF0F4;stroke-width:2.4;fill:none}
.hs-lead{stroke:var(--tr-mute);stroke-width:1;fill:none;stroke-dasharray:3 3}
.hs-num{fill:#15252F;stroke:var(--tr-mute);stroke-width:1.5}
.trassa .hs-n{fill:#EAF0F4;font-weight:700;font-size:15px}
.trassa .hs-t{fill:#EAF0F4;font-size:14px;font-weight:600}
.hs:hover .hs-body,.hs.on .hs-body,.hs:focus .hs-body{fill:var(--acc);stroke:var(--acc)}
.hs:hover .hs-num,.hs.on .hs-num{fill:var(--acc);stroke:var(--acc)}
.hs:hover .hs-n,.hs.on .hs-n{fill:var(--acc-ink)}
.hs.on .hs-t{fill:var(--acc)}
.hs.on .hs-x{stroke:var(--acc-ink)}
.wiz{display:grid;grid-template-columns:290px 270px minmax(0,1fr);gap:14px;margin-top:16px;align-items:start}
.wstep{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.wstep>i{font-style:normal;font-family:var(--mono);color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.1em}
.wstep>b{display:block;font-size:18px;margin:4px 0 12px}
.fn{display:block;width:100%;text-align:left;padding:8px 12px;margin-bottom:6px;border:1px solid var(--line-2);background:transparent;border-radius:8px;cursor:pointer;font-weight:600}
.fn small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.fn.on{border-color:var(--acc);background:var(--sel);color:var(--acc)}
.wstep label{display:block;font-size:12px;color:var(--mute);margin-bottom:12px}
.wstep select,.wstep input{display:block;width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg);font-size:16px}
.w-n{font-size:13px;color:var(--mute);margin:0 0 10px}
.crow{background:var(--bg)}
.glyph,.crow-img .glyph,.tile-img.flat .glyph,.v3d.nomodel .glyph{stroke:#5F7180}
.sec-h{margin:40px 0 14px;font-size:24px}
/* карточка */
.c-hero{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0;margin-top:22px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.c-hero .v3d{border:0;border-radius:0;min-height:520px}
.c-info{padding:24px;display:flex;flex-direction:column;gap:16px}
.c-info h1{font-size:28px}
.c-code{font-family:var(--mono);font-weight:700;color:var(--acc);letter-spacing:.06em;font-size:14px}
.c-code a{color:inherit;text-decoration:none}
.c-info .order{background:var(--bg)}
.c-info .loads{gap:6px}
.c-info .load{background:var(--bg);padding:6px 10px 6px 4px}
.c-info .load svg{width:50px;height:32px}
.c-info .load span{font-size:16px}
.c-sec{margin-top:26px}
.c-sec:empty{display:none}
.c-two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
/* PDF: светлые внутренние страницы, тёмная обложка */
body.print{--bg:#FFFFFF;--panel:#FFFFFF;--ink:#0D1922;--mute:#56687A;--line:#DCE2E7;--line-2:#B4C0CA;--link:#8A5A00;--sel:#FFF6DC;--load:#FFF9E8;--th:#0D1922;--th-ink:#FFFFFF;--wm-filter:none;--logo-bg:#0D1922;--logo-fg:#fff}
body.print .c-hero{grid-template-columns:1fr 1fr;margin-top:0;border-radius:6px}
body.print .c-hero .v3d{min-height:0}
body.print .c-info{padding:10px;gap:8px}
body.print .c-info h1{font-size:16pt}
body.print .c-sec{margin-top:10px}
body.print .c-two{gap:12px}
@media(max-width:1000px){.wiz,.c-hero,.c-two{grid-template-columns:1fr}.hero h1{font-size:30px}.top nav{display:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <span data-ui="logo"></span>
  <nav><a href="#/" data-nav="home">Трасса</a><a href="#/faq" data-nav="faq">Вопросы</a><a href="#/glossary" data-nav="glossary">Словарь</a></nav>
  <span data-ui="search"></span><span data-ui="views"></span><span data-ui="specBtn"></span>
</div></header>
<main id="view"></main>
<noscript><p style="padding:20px">Каталог работает со скриптами. Без них доступен <a href="t/index.html">список всех типов с таблицами исполнений</a>.</p></noscript>
<footer class="site-foot"><div class="wrap"><span data-ui="contacts"></span></div></footer>

<script src="data/index.js?v=2610120115"></script>
<script src="data/trassa.js?v=2610120115"></script>
<script src="assets/vendor/three.min.js"></script>
<script src="assets/vendor/OrbitControls.js"></script>
<script src="assets/vendor/GLTFLoader.js"></script>
<script src="assets/vendor/RoomEnvironment.js"></script>
<script>
(function () {
  var K = KAT, st = { fn: 'nepodvizhnaya', dn: '', kn: 0 };
  function paint() {
    var U = KATUI;
    Array.prototype.forEach.call(document.querySelectorAll('.hs,.fn'), function (n) { n.classList.toggle('on', n.getAttribute('data-fn') === st.fn); });
    var r = document.getElementById('w-res'); if (!r) return;
    var tasks = K.tasks.some(function (t) { return t.fn === st.fn; }) ? '<div style="margin-top:14px">' + U.tasks(st.fn) + '</div>' : '';
    if (!st.dn && !st.kn) {
      var cs = K.cats.filter(function (c) { return c.fn === st.fn; });
      r.innerHTML = '<p class="w-n">Типов с таким назначением: ' + cs.length + '. Задайте диаметр — покажем исполнения.</p>' + U.rows(cs.slice(0, 8)) + (cs.length > 8 ? '<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--acc);font-weight:600;font-size:14px">Ещё ' + (cs.length - 8) + '</summary><div style="margin-top:6px">' + U.rows(cs.slice(8)) + '</div></details>' : '') + tasks;
      return;
    }
    var my = st.fn + '|' + st.dn + '|' + st.kn;
    U.find({ fn: st.fn, dn: st.dn, kn: st.kn }, function (rows) {
      if (my !== st.fn + '|' + st.dn + '|' + st.kn) return;
      r.innerHTML = '<p class="w-n">Подходящих исполнений: ' + rows.length + (rows.length ? '' : '. Проверьте соседний диаметр или назначение.') + '</p>' + U.itemRows(rows, 40) + tasks;
    });
  }
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-fn]'); if (b) { st.fn = b.getAttribute('data-fn'); paint(); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('hs')) { st.fn = e.target.getAttribute('data-fn'); paint(); } });
  document.addEventListener('input', function (e) { if (e.target.id === 'w-dn') st.dn = e.target.value; else if (e.target.id === 'w-kn') st.kn = parseFloat(e.target.value) || 0; else return; paint(); });
  window.VARIANT = {
    id: 'uzel',
    home: function (el) {
      var U = KATUI;
      el.innerHTML = '<div class="wrap"><section class="hero"><h1>Покажите место на трассе — <em>подберём опору</em></h1>' +
        '<p class="lead">Каждая опора решает свою задачу. Нажмите на узел схемы, задайте диаметр и нагрузку — получите исполнение с размерами и строкой для заявки.</p>' +
        '<div class="scheme">' + window.TRASSA + '</div></section>' +
        '<div class="wiz"><div class="wstep"><i>ШАГ 1</i><b>Что должна делать опора</b>' + U.FNS.map(function (f) { return '<button class="fn" data-fn="' + f[0] + '">' + f[1] + '<small>' + f[2] + '</small></button>'; }).join('') + '</div>' +
        '<div class="wstep"><i>ШАГ 2</i><b>Труба и нагрузка</b><label>Наружный диаметр Dн, мм<select id="w-dn"><option value="">любой</option>' + K.dns.map(function (d) { return '<option' + (String(d) === st.dn ? ' selected' : '') + '>' + d + '</option>'; }).join('') + '</select></label><label>Нагрузка не менее, кН<input id="w-kn" type="number" min="0" placeholder="из проекта" value="' + (st.kn || '') + '"></label><p style="font-size:13px;color:var(--mute);margin:0">Dн — наружный диаметр, не условный проход: Ду 100 — это Dн 108. <a class="xl" href="#/faq/7">Подробнее</a></p></div>' +
        '<div class="wstep"><i>ШАГ 3</i><b>Подходящие опоры</b><div id="w-res"></div></div></div>' +
        '<h2 class="sec-h">Весь каталог: ' + K.total.cats + ' типов, ' + K.total.items + ' исполнений</h2>' + U.groups() + '</div>';
      paint();
    },
    card: function (c, it) {
      var U = KATUI, P = U.PRINT, g = U.groupBy(c.g), sch = U.schema(c);
      return '<div class="wrap"><div class="c-hero">' + U.viewer(c, it) + '<div class="c-info"><div><div class="c-code"><a href="#/g/' + g.id + '">' + U.esc(g.title.replace(/\s*\(.*$/, '').toUpperCase()) + '</a> · ' + U.esc(c.code) + '</div><h1>' + U.esc(c.title) + '</h1></div><p style="margin:0;color:var(--mute)">' + U.esc(c.text.lead) + '</p>' + U.loadsLegend(c) + U.order(c, it) + (P ? '' : U.files(c, it)) + '</div></div>' +
        '<div class="c-sec">' + U.about(c) + '</div>' +
        '<div class="c-sec"><h4>Таблица исполнений' + (c.m && !P ? ' — нажмите строку, чтобы увидеть модель' : '') + '</h4>' + U.table(c, it) + '</div>' +
        '<div class="c-sec c-two">' + (sch ? '<div><h4>Габаритная схема</h4>' + sch + '</div>' : '') + '<div><div class="box">' + U.facts(c) + '</div><div style="margin-top:16px">' + U.kit(c) + '</div></div>' + (sch ? '' : '<div>' + U.related(c) + '</div>') + '</div>' +
        '<div class="c-sec c-two"><div>' + (P ? '' : U.faqFor(c)) + '</div><div>' + (sch ? U.related(c) : '') + '</div></div></div>';
    }
  };
})();
</script>
<script src="kat.js?v=2610120115"></script>
</body>
</html>
